apiVersion: v1
kind: Pod
metadata:
  name: pinger-test
  labels:
    app: mesh-pinger
spec:
  serviceAccountName: mesh-pinger-sa  # ← tillagd: ger RBAC-behörighet att lista pods

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001

  containers:
  - name: main-app
    image: hashicorp/http-echo:latest
    args:
      - "-text=OK"
      - "-listen=:8081"
    ports:
      - containerPort: 8081
        name: app-http
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"
      limits:
        memory: "64Mi"
        cpu: "100m"

  - name: pinger
    image: mesh-pinger:v3
    imagePullPolicy: Never
    env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: TARGET_LABEL
        value: "mesh-pinger"
    ports:
      - containerPort: 8090
        name: pinger-http
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
    startupProbe:
      httpGet:
        path: /health
        port: 8090
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 10
    readinessProbe:
      httpGet:
        path: /health
        port: 8090
      initialDelaySeconds: 2
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 2
    livenessProbe:
      httpGet:
        path: /health
        port: 8090
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3